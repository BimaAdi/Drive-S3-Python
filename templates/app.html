<html>
<head>
    <title>Drive S3</title>
</head>
<body>
    <form method="POST" action="/logout">
        <button type="submit">Logout</button>
    </form>
    <form method="POST" action="/app/create-folder/{{ file_path }}">
        <input type="text" name="foldername">
        <button type="submit">Create Folder</button>
    </form>
    <form method="POST" action="/app/upload/" enctype="multipart/form-data">
        <input type="file" name="file">
        <button type="submit">Upload File</button>
    </form>
    <p>{{ file_path }}</p>
    <ul>
      {% for item in tree %}
        {% if item.type == "file" %}
          <li><a href="/app/download/{{ item.id }}">{{ item.name }}</a></li>
        {% else %}
          <li><a href="/app/{{ item.id }}">{{ item.name }}/</a></li>
        {% endif %}
      {% else %}
        <li>folder is empty</li>
      {% endfor %}
    </ul>
</body>
</html>
