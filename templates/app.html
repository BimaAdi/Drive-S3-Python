<html>
<head>
    <title>Drive S3</title>
</head>
<body>
    <form method="POST" action="/logout">
        <button type="submit">Logout</button>
    </form>
    <form method="POST" action="/app/create-folder/{{ file_path }}">
        <input type="text" name="foldername">
        <button type="submit">Create Folder</button>
    </form>
    <form method="POST" action="/app/upload/" enctype="multipart/form-data">
        <input type="file" name="file">
        <button type="submit">Upload File</button>
    </form>
    <ul>
      {% if parent_file_path is not none %}
        <li><a href="/app/{{ parent_file_path }}">../</a></li>
      {% endif %}
      {% for item in tree %}
        {% if item.type == "file" %}
          <li>
            <div style="display: flex; gap: 10px;list-style-type: disc;">
              <a href="/app/download/{{ item.id }}">{{ item.name }}</a>
              <form method="POST" action="/app/delete/{{ file_path }}">
                <input type="hidden" name="file_id" value="{{ item.id }}">
                <button type="submit">Delete</button>
              </form>
            </div>
          </li>
        {% else %}
          <li><a href="/app/{{ item.id }}">{{ item.name }}/</a></li>
        {% endif %}
      {% else %}
        <li>folder is empty</>
      {% endfor %}
    </ul>
</body>
</html>
