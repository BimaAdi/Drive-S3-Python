[project]
name = "drive-s3"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.111",
    "fastapi[standard]>=0.143.0",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pytest.ini_options]
# Run the suite across all available CPU cores with pytest-xdist.  Tests are
# isolated (in-memory SQLite + mocked S3), so parallel runs are safe.
addopts = "-n auto"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]
