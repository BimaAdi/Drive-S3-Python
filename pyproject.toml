[project]
name = "drive-s3"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.111",
    "fastapi[standard]>=0.143.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]
